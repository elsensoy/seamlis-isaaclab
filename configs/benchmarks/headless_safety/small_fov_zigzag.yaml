experiment_name: headless_small_fov_zigzag_r2
dt: 0.1
tf: 80.0
exploration_algorithm: CoScan
show_animation: false
max_ticks: 800
seed: 104

environment:
  width: 24.0
  height: 18.0
  resolution: 0.16
  use_default_layout: false
  circles:
    - [3.5, 14.0, 0.42]
    - [8.0, 3.0, 0.42]
    - [13.0, 15.0, 0.42]
    - [19.0, 3.5, 0.42]
  superellipsoids:
    - [7.0, 8.0, 0.30, 3.0, 10.0, 0.0]
    - [12.0, 10.0, 0.30, 3.0, 10.0, 0.0]
    - [17.0, 8.0, 0.30, 3.0, 10.0, 0.0]
  unknown_obstacles:
    - [5.8, 5.0, 0.32]
    - [8.4, 11.2, 0.32]
    - [10.7, 6.5, 0.32]
    - [13.5, 12.3, 0.32]
    - [15.8, 5.7, 0.32]
    - [18.2, 11.5, 0.32]

controller:
  pos: mpc_cbf
  att: gatekeeper
  gatekeeper:
    nominal: visibility_area
    backup: velocity_tracking_yaw
    nominal_horizon: 1.3
    backup_horizon: 1.2
    horizon_discount: 0.05
    braking_margin: 0.9

robots:
  common:
    model: DoubleIntegrator2D
    radius: 0.15
    v_max: 1.5
    a_max: 2.0
    # This 50-degree ablation intentionally stresses blind-side motion; the
    # other benchmark scenarios use 70 degrees.
    fov_angle: 50.0
    cam_range: 4.5
    mpc_horizon: 10
    mpc_cbf_alpha1: 0.55
    mpc_cbf_alpha2: 0.55
    unknown_obs_detection: fov
    visibility_violation_mode: point_mass
    visibility_violation_tolerance: 0.02
  instances:
    - robot_id: 0
      x0: [2.0, 2.0, 0.0]
    - robot_id: 1
      x0: [2.0, 16.0, -1.5708]
