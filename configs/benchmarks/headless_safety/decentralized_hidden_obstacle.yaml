experiment_name: headless_decentralized_hidden_r2
dt: 0.1
tf: 80.0
exploration_algorithm: Frontier
show_animation: false
max_ticks: 800
seed: 103

environment:
  width: 24.0
  height: 18.0
  resolution: 0.16
  use_default_layout: false
  circles:
    - [4.0, 4.0, 0.45]
    - [4.0, 14.0, 0.45]
    - [12.0, 4.0, 0.45]
    - [12.0, 14.0, 0.45]
    - [20.0, 4.0, 0.45]
    - [20.0, 14.0, 0.45]
  # The wall and doorway make one robot observe the hidden obstacle earlier;
  # obstacle memories remain local, matching the decentralized failure mode.
  superellipsoids:
    - [12.0, 3.5, 0.30, 3.5, 10.0, 0.0]
    - [12.0, 14.5, 0.30, 3.5, 10.0, 0.0]
  unknown_obstacles:
    - [10.8, 9.0, 0.38]
    - [14.8, 9.7, 0.34]
    - [8.0, 11.8, 0.30]
    - [17.5, 6.5, 0.30]

controller:
  pos: mpc_cbf
  att: gatekeeper
  gatekeeper:
    nominal: visibility_area
    backup: velocity_tracking_yaw
    nominal_horizon: 1.3
    backup_horizon: 1.2
    horizon_discount: 0.05
    braking_margin: 0.9

robots:
  common:
    model: DoubleIntegrator2D
    radius: 0.15
    v_max: 1.5
    a_max: 2.0
    fov_angle: 70.0
    cam_range: 4.5
    mpc_horizon: 10
    mpc_cbf_alpha1: 0.55
    mpc_cbf_alpha2: 0.55
    unknown_obs_detection: fov
    visibility_violation_mode: point_mass
    visibility_violation_tolerance: 0.02
  instances:
    - robot_id: 0
      x0: [2.0, 3.0, 0.0]
    - robot_id: 1
      x0: [22.0, 15.0, 3.1416]
