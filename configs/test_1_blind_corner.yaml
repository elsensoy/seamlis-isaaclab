experiment:
  name: EXP_01_blind_corner_gatekeeper
  dt: 0.05
  exploration_algorithm: CoScan
  show_animation: true
  save_animation: false
  max_ticks: 5000

environment:
  width: 20.0
  height: 18.0
  resolution: 0.1

  # Simple "corner" barrier; add more circles for a tighter corridor
  circles:
    - [6.0, 2.0, 0.9] #[x_coordinate, y_coordinate, radius]
    - [6.0, 5.5, 0.9]
    - [6.0, 7.0, 0.9]

  # Known walls to create an L-shaped corridor
  superellipsoids:
    - [5.0, 2.0, 5.0, 0.35, 4.0, 0.0]      # Horizontal Wall (Bottom)
    - [5.0, 4.0, 0.5, 5.0, 4.0, 0.0]       # Vertical Wall (Left)
    - [4.0, 5.0, 6.0, 1.2, 6.0, 0.0]    # Horizontal Wall (Top)
    # [x, y, scale\_x, scale\_y, \epsilon, \theta]$$
  
  # The "Trap": An unknown obstacle right around the bend
  unknown_obstacles:
    - [7.0, 4.0, 0.6] # This is hidden from the start position

robots:
  common:
    model: DoubleIntegrator2D
    sensor: rgbd
    exploration: true
    reached_threshold: 2.0
    radius: 0.25
    cam_range: 4.0
    fov_angle: 60.0
    flight_z: 1.0
  instances:
    - robot_id: 0
      x0: [2.0, 3.0, 0.0, 0.0, 1.5707] # Facing "North" up the corridor
    - robot_id: 1
      x0: [2.0, 10.0, 0.0, 0.0, 0.0]

controller:
  pos: mpc_cbf
  att: gatekeeper
