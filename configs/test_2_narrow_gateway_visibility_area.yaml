experiment:
  name: EXP_02_narrow_gateway_visibilityarea
  dt: 0.05
  exploration_algorithm: CoScan
  show_animation: false
  save_animation: false
  max_ticks: 5000

environment:
  width: 20.0
  height: 18.0
  resolution: 0.1

  # Wall of touching circles (radius 0.7, spaced 1.4 apart) with a single
  # 0.7m gap at the vertical center (y=9) -- just wide enough for a
  # 0.25-radius robot (0.5m diameter) to thread through. The bottom-most
  # circle (that would have sat at y=2.35) is omitted, leaving an open route
  # around the wall's lower end as an alternate path besides the gap. The
  # remaining circles alternate known (mapped in advance, listed here) and
  # unknown (must be detected via FOV/lidar, listed under
  # unknown_obstacles below) to test that mix along one obstacle line.
  circles:
    - [10.0, 3.75, 0.7]
    - [10.0, 6.55, 0.7]
    - [10.0, 10.05, 0.7]
    - [10.0, 12.85, 0.7]
    - [10.0, 15.65, 0.7]

  superellipsoids: []
  unknown_obstacles:
    - [10.0, 5.15, 0.7]
    - [10.0, 7.95, 0.7]
    - [10.0, 11.45, 0.7]
    - [10.0, 14.25, 0.7]

robots:
  common:
    model: DoubleIntegrator2D
    sensor: rgbd
    exploration: true
    reached_threshold: 2.0
    radius: 0.25
    cam_range: 5.0
    fov_angle: 70.0
  instances:
    - robot_id: 0
      x0: [6.0, 6.0, 0.0, 0.0, 0.0]
    - robot_id: 1
      x0: [14.0, 6.0, 0.0, 0.0, 3.14159]

controller:
  pos: mpc_cbf
  att: visibility_area
