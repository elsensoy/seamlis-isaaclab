# configs/gatekeeper_known.yaml
experiment:
  name: gatekeeper_known
  dt: 0.05
  exploration_algorithm: CoScan      # or Frontier
  show_animation: false              # true if want videos
  save_animation: false
  max_ticks: 5000                    # safety cap

environment:
  width: 20.0
  height: 20.0
  resolution: 0.1

  # Known obstacles (same semantics as Env._make_default_known_obs)
  # circles: [x, y, r]
  circles:
    - [2.2, 5.0, 0.2]
    - [3.0, 5.0, 0.2]

  # superellipsoids: [ox, oy, a, b, e, theta]
  superellipsoids:
    - [12.0, 6.0, 1.0, 1.5, 10.0, 0.785398]
    - [7.0, 11.5, 0.5, 1.3, 10.0, -0.261799]

  # No unknown obstacles in this scenario
  unknown_obstacles: []

robots:
  common:
    model: DoubleIntegrator2D
    sensor: rgbd
    exploration: true
    reached_threshold: 2.0
    radius: 0.25

  instances:
    - robot_id: 0
      x0: [2.0, 2.0, 0.0, 0.0, 1.570796]   # [x, y, vx, vy, theta]
      cam_range: 5.0
      fov_angle: 70.0
    - robot_id: 1
      x0: [15.0, 2.0, 0.0, 0.0, 1.570796]
      cam_range: 7.0
      fov_angle: 90.0

controller:
  pos: mpc_cbf
  att: gatekeeper # gatekeeper