# Recording-only variant of test_10_unknown_smallfov_gatekeeper.yaml: same
# narrow FOV (40deg) and original 2 unknown obstacles, scaled from 2 to 5
# robots, plus 5 known obstacles and 4 more unknown obstacles interspersed
# between them (shared with the other _isaac variants recorded alongside
# this one). 26x20 map, dimensions proven clean of warehouse shelf overlap
# via the stress-test recording. Gatekeeper controller -- paired with
# smallfov_5robots_visibility_area_isaac.yaml (identical environment/robots,
# only controller.att differs).
experiment_name: "SmallFoV_5Robots_Gatekeeper"
dt: 0.05
tf: 60.0
exploration_algorithm: CoScan
show_animation: false
max_ticks: 1200

environment:
  width: 26.0
  height: 20.0
  resolution: 0.15
  circles:
    - [8.0, 8.0, 0.5]
    - [18.0, 8.0, 0.5]
    - [8.0, 12.0, 0.5]
    - [18.0, 12.0, 0.5]
    - [13.0, 10.0, 0.6]
  superellipsoids: []
  unknown_obstacles:
    - [6.0, 6.0, 0.6]
    - [9.0, 9.0, 0.6]
    - [10.5, 9.0, 0.3]
    - [15.5, 9.0, 0.3]
    - [10.5, 11.0, 0.3]
    - [15.5, 11.0, 0.3]

robots:
  common:
    model: DoubleIntegrator2D
    sensor: rgbd
    exploration: true
    reached_threshold: 2.0
    radius: 0.25
    cam_range: 4.0
    fov_angle: 40.0
  instances:
    - robot_id: 0
      x0: [2.0, 2.0, 0.0, 0.0, 0.785398]
    - robot_id: 1
      x0: [2.0, 18.0, 0.0, 0.0, -0.785398]
    - robot_id: 2
      x0: [24.0, 2.0, 0.0, 0.0, 2.356194]
    - robot_id: 3
      x0: [24.0, 18.0, 0.0, 0.0, -2.356194]
    - robot_id: 4
      x0: [13.0, 2.0, 0.0, 0.0, 1.570796]

controller:
  pos: mpc_cbf
  att: gatekeeper
  gatekeeper:
    nominal: visibility_area
    backup: velocity_tracking_yaw
    nominal_horizon: 0.4
    backup_horizon: 1.8
    braking_margin: 0.9
